name: FitTrack Android-App

on:
  push:
    paths:
      - "fitness-app/**"
      - ".github/workflows/fittrack-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitness-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk FitTrack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitTrack-apk
          path: fitness-app/FitTrack.apk

      - name: Als GitHub-Release veröffentlichen (Download direkt aufs Handy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "fittrack-${{ github.run_number }}" FitTrack.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "FitTrack 1.0.${{ github.run_number }}" \
            --notes "Android-APK für das Pixel. Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben). Updates installieren sich über die alte Version, die Daten bleiben erhalten." \
            --latest
