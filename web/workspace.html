<title>Chaos Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: feste Seitenleiste mit Navigationsgruppen links, Arbeitsflaeche rechts.
   Look: rohe Arena - Stein, Sand, verbrannte Kanten. Teamfarben und Token-Farben kommen aus state.json. */
:root {
  --bg: #e7e3dc;
  --panel: #f4f1ec;
  --sunk: #dcd6cc;
  --line: #cbc3b6;
  --fg: #221f1b;
  --muted: #675f54;
  --accent: #8b6326;
  --accent-ink: #fbf7ef;
  --stage: #cfc6b6;
  --live: #4f7a44;
  --planned: #9a7b3c;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191714; --panel: #221f1b; --sunk: #14120f; --line: #38332c; --fg: #ece6dc;
    --muted: #a59b8c; --accent: #d6a24c; --accent-ink: #1b1611; --stage: #2a2620;
    --live: #86b679; --planned: #d0aa5a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191714; --panel: #221f1b; --sunk: #14120f; --line: #38332c; --fg: #ece6dc;
  --muted: #a59b8c; --accent: #d6a24c; --accent-ink: #1b1611; --stage: #2a2620;
  --live: #86b679; --planned: #d0aa5a; color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: 0.86em; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }

/* ---------- Seitenleiste */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 24px;
  padding-inline: 18px; padding-block: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: grid; gap: 2px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 0.9; letter-spacing: 0.01em; text-transform: uppercase; }
.brand-step { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
#nav { display: grid; gap: 18px; }
.nav-group-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.nav-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav-group a { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-decoration: none;
  padding: 6px 10px; border-radius: var(--radius); font-weight: 500; }
.nav-group a:hover { background: var(--sunk); }
.nav-group a.is-planned { color: var(--muted); font-weight: 400; }
.nav-group a[aria-current="page"] { background: var(--fg); color: var(--bg); }
.nav-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
.is-planned .nav-dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--planned); }

.bridge { margin-top: auto; border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 8px; }
.bridge .label { margin: 0; }
.bridge-cmd { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; background: var(--sunk); border-radius: var(--radius); padding: 7px 8px 7px 10px; }
.bridge-cmd code { white-space: nowrap; font-size: 12px; }
.bridge p { font-size: 12.5px; color: var(--muted); }
.bridge-copy { font: 500 12px var(--font-body); border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  border-radius: var(--radius); padding: 3px 8px; cursor: pointer; }

/* ---------- Arbeitsflaeche */
main { padding-inline: 36px; padding-block: 28px 56px; min-width: 0; }
.view { display: grid; gap: 22px; max-width: 1240px; }
.sec-head { display: grid; gap: 6px; }
.eyebrow, .label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.sec-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.sec-head h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 4.4vw, 52px); line-height: 0.95; text-transform: uppercase; letter-spacing: 0.005em; }
.lead { color: var(--muted); max-width: 68ch; font-size: 16px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.02em; }
h3 { font-size: 16px; font-weight: 600; }

.pill { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill-live { color: var(--live); box-shadow: inset 0 0 0 1.5px var(--live); }
.pill-planned { color: var(--planned); box-shadow: inset 0 0 0 1.5px var(--planned); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--team); margin-right: 7px; vertical-align: -1px; flex: none; }

/* ---------- Platzhalter */
.empty { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 4px; }
.empty-title { font-family: var(--font-display); font-weight: 700; font-size: 26px; text-transform: uppercase; color: var(--planned); }
.empty-text { color: var(--muted); }
.examples { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.examples li { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; background: var(--panel); border-radius: var(--radius); color: var(--muted); min-width: 0; }
.tag { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; flex: none; }

/* ---------- Live-Ansicht */
.live { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.stage-wrap { margin: 0; display: grid; gap: 8px; min-width: 0; }
.stage { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: var(--stage); border-radius: var(--radius); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
.stage-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; }
.legend-chip { display: inline-flex; align-items: center; font-weight: 500; }
.legend-cam { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }

.combat { display: grid; gap: 14px; min-width: 0; }
.btn-roll { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: 0.03em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform 0.06s, box-shadow 0.06s; }
.btn-roll:hover { filter: brightness(1.06); }
.btn-roll:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
.btn-quiet { justify-self: start; font: 500 13px var(--font-body); color: var(--muted); background: none; border: 1px solid var(--line);
  border-radius: var(--radius); padding: 5px 10px; cursor: pointer; }
.btn-quiet:hover { color: var(--fg); }

.log-wrap { display: grid; gap: 6px; }
.log-empty { color: var(--muted); font-size: 13.5px; padding: 12px; background: var(--panel); border-radius: var(--radius); }
.log { list-style: none; margin: 0; padding: 4px; background: var(--sunk); border-radius: var(--radius); max-height: 260px; overflow-y: auto;
  font-family: var(--font-mono); font-size: 12.5px; display: grid; gap: 2px; }
.log:empty { display: none; }
.log li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; padding: 7px 8px; background: var(--panel); border-radius: 3px; }
.log-round { color: var(--muted); font-variant-numeric: tabular-nums; }
.log-body { display: grid; gap: 1px; min-width: 0; }
.log-swing { display: flex; align-items: center; }
.log-result { font-weight: 500; }
.log-result::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--tok); margin-right: 7px; }
.log-roll { color: var(--muted); font-size: 11.5px; }
.log-roll b { font-weight: 500; color: var(--fg); }

.counter { background: var(--panel); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; border: 1px solid var(--line); }
.counter-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.counter .sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.total-num { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 0.85; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tile { display: grid; gap: 0; padding: 8px 10px; background: var(--bg); border-radius: 3px; border-top: 3px solid var(--tok); min-width: 0; }
.tile-label { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; }
.tile .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tok); margin-right: 6px; }
.tile-num { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-src { font-size: 11.5px; color: var(--muted); }
.tile-off { opacity: 0.5; border-top-style: dashed; }
.per-fighter { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.per-fighter th, .per-fighter td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); font-weight: 500; }
.per-fighter th:first-child { text-align: left; }
.per-fighter thead th { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.per-fighter tbody th { display: flex; align-items: center; }

/* ---------- Werkstatt: 3D-Modelle */
.model-group { display: grid; gap: 10px; }
.model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.model-card { background: var(--panel); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--line); }
.thumb { display: block; width: 100%; height: auto; aspect-ratio: 6 / 5; background: var(--stage); }
.thumb-error { display: grid; place-items: center; padding: 16px; color: var(--muted); font-size: 13px; }
.model-body { padding: 14px; display: grid; gap: 8px; align-content: start; }
.model-body > p { color: var(--muted); font-size: 14px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.facts-wide { font-size: 14.5px; gap: 8px 20px; max-width: 760px; }

/* ---------- Projekt */
.pillars { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.pillar { background: var(--panel); padding: 16px; border-radius: var(--radius); display: grid; gap: 6px; align-content: start; }
.pillar h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-transform: uppercase; }
.pillar p { color: var(--muted); }
.block { display: grid; gap: 10px; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-width: 760px; }
.rules li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-radius: var(--radius); }
.rules li > span:nth-child(2) { flex: 1; min-width: 12ch; }
.token-chip { background: var(--tok); color: #fff; font-weight: 600; font-size: 12.5px; padding: 2px 9px; border-radius: 3px; min-width: 64px; text-align: center; }

.roadmap, .logbook { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-width: 860px; }
.roadmap > li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 14px; background: var(--panel); border-radius: var(--radius); }
.road-step { font-family: var(--font-display); font-weight: 800; font-size: 20px; text-transform: uppercase; color: var(--muted); }
.road-done .road-step { color: var(--live); }
.road-proposal { background: transparent; border: 1.5px dashed var(--line); }
.road-title { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 4px; }
.road-body ul, .logbook ul { margin: 0; padding-left: 18px; color: var(--muted); }
.logbook > li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 16px; background: var(--panel); border-radius: var(--radius); }
.logbook h3 { margin-bottom: 6px; }
.lb-meta { display: grid; gap: 2px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); align-content: start; }
.lb-version { font-family: var(--font-display); font-size: 26px; font-weight: 800; color: var(--fg); line-height: 1; }

/* ---------- Schmal */
@media (max-width: 1180px) {
  .live { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-inline: 16px; padding-block: 16px; gap: 14px; }
  #nav { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
  .nav-group { flex: none; }
  .nav-group ul { display: flex; gap: 2px; }
  .nav-group a { white-space: nowrap; }
  .bridge { margin-top: 0; }
  main { padding-inline: 16px; padding-block: 20px 40px; }
  .roadmap > li, .logbook > li { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .legend-cam { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .btn-roll { transition: none; }
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="brand-name" id="brand-name">Chaos Arena</span>
      <span class="brand-step" id="brand-step"></span>
    </div>
    <nav id="nav" aria-label="Bereiche"></nav>
    <div class="bridge">
      <p class="label">Architekten-Brücke</p>
      <div class="bridge-cmd"><code id="export-cmd"></code><button class="bridge-copy" id="export-copy" type="button">Kopieren</button></div>
      <p>Lokal ausführen. Schreibt alle .py, .json, .js und .html in <code id="export-file"></code>.</p>
    </div>
  </aside>
  <main id="sections"></main>
</div>
